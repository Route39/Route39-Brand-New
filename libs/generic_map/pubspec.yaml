name: generic_map
description: A generic maps api supporting Google Maps, Mapbox, OpenStreetMaps and MapLibre
version: 0.12.0
homepage: https://bettersuite.io

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  gm_google_maps_flutter: ^2.18.0
  flutter_map: ^8.2.2
  flutter_map_animations: ^0.9.0
  flutter_map_location_marker: ^10.1.0
  flutter_map_line_editor: ^8.0.0
  latlong2: ^0.9.1
  mapbox_maps_flutter: ^2.12.0
  flutter_map_heatmap_plus: ^0.1.0

  flutter:
    sdk: flutter
  collection: ^1.19.1
  flutter_map_tile_caching: ^10.1.1
  flutter_map_dragmarker: ^8.0.3
  # geotypes: ^0.0.2
  # maplibre_gl: ^0.22.0
  image: ^4.5.4

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - assets/map_styles/
