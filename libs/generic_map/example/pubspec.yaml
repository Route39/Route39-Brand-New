name: generic_map_widgetbook
description: "A new Flutter project."
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

  generic_map:
    path: ..
  widgetbook: ^3.14.2
  widgetbook_annotation: ^3.5.0
  latlong2: ^0.9.1
  geolocator: ^14.0.1
  flutter_dotenv: ^5.2.1

  maplibre_gl: ^0.22.0
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  widgetbook_generator: ^3.13.0
  build_runner: ^2.4.15

dependency_overrides:
  gm_google_maps_flutter:
    path: ../packages/packages/google_maps_flutter/google_maps_flutter
  gm_google_maps_flutter_android:
    path: ../packages/packages/google_maps_flutter/google_maps_flutter_android
  gm_google_maps_flutter_ios:
    path: ../packages/packages/google_maps_flutter/google_maps_flutter_ios
  gm_google_maps_flutter_platform_interface:
    path: ../packages/packages/google_maps_flutter/google_maps_flutter_platform_interface
  gm_google_maps_flutter_web:
    path: ../packages/packages/google_maps_flutter/google_maps_flutter_web

flutter:
  uses-material-design: true

  assets:
    - .env
