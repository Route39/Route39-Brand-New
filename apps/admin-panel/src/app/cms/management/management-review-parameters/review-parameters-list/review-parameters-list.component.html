<nz-page-header [nzGhost]="false" nzBackIcon [nzTitle]="'reviewParameters.title' | translate"
  [nzSubtitle]="'reviewParameters.subtitle' | translate">
  <nz-page-header-extra>
    <button nz-button nzType="primary" routerLink="new"><i nz-icon nzType="plus"></i>{{ 'profile.add' | translate
  }}</button>
</nz-page-header-extra>
<nz-page-header-content>
  @if ((query | async)?.data?.feedbackParameters; as regions) {
    <nz-table #ajaxTable nzShowSizeChanger [nzFrontPagination]="false"
      [nzData]="regions" [nzTotal]="regions.length"
      nzBordered>
      <thead>
        <tr>
          <th>{{ 'profile.name' | translate }}</th>
          <th>Type</th>
        </tr>
      </thead>
      <tbody>
        @for (data of ajaxTable.data; track data) {
          <tr [routerLink]="'view/' + data.id" class="group cursor-pointer">
            <td>{{ data.title }}</td>
            <td>
              <nz-tag [nzColor]="tagColor.boolean(data.isGood)" [nzBordered]="false">{{ data.isGood ? "Good" : "Bad"
              }}</nz-tag>
            </td>
          </tr>
        }
      </tbody>
    </nz-table>
  }
</nz-page-header-content>
</nz-page-header>
