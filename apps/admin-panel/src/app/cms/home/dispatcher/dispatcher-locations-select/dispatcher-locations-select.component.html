<google-places-autocomplete (setAddress)="getAddress($event)" adressType="geocode"></google-places-autocomplete>
<google-map height="700px" width="100%" (mapClick)="mapClicked($event)">
  @for (markerPosition of drivers; track markerPosition) {
    <map-marker #marker [position]="markerPosition.location"
      [options]="{ draggable: false }"
    [title]="markerPosition.driverId.toString()"></map-marker>
  }
  @for (point of points; track point) {
    <map-marker [position]="point.location" [options]="{ draggable: false }"
    [title]="point.address"></map-marker>
  }
</google-map>
<nz-card>
  <nz-timeline class="pt-16">
    @for (point of points; track point) {
      <nz-timeline-item>{{point.address}}</nz-timeline-item>
    }
  </nz-timeline>
</nz-card>
<button nz-button nzDanger (click)="removeLastPoint()" style="margin-top: 8px; margin-right: 4px;">
  <span>{{'dispatcher.removeLastPoint' | translate }}</span>
</button>
<button nz-button nzType="default" (click)="goToServiceSelection()" [disabled]="points.length === 0" style="margin-top: 8px;">
  <span>{{'profile.next' | translate }}</span>
</button>
