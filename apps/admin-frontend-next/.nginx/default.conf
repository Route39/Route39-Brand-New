server {
    listen       8080;
    listen  [::]:8080;
    server_name  _;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_vary on;
    gzip_types
        application/javascript
        application/json
        application/wasm
        text/css
        text/html
        text/plain
        image/svg+xml;

    root   /usr/share/nginx/html;
    index  index.html;

    # SPA lives under /admin/ to match the deployed base path. SPA fallback
    # rewrites unknown subpaths back to /admin/index.html.
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    # Long cache for hashed asset filenames (Vite emits content-hashed names).
    location ~* ^/admin/assets/.+\.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|webp|wasm)$ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Don't cache the entrypoint
    location = /admin/index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Anything outside /admin/ inside this container is unexpected; bounce to /admin/.
    location = / {
        return 302 /admin/;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
