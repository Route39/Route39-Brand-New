  <meta name="apple-mobile-web-app-capable" content="yes">

  <script>
    // The value below is injected by flutter build, do not touch.
    const serviceWorkerVersion = null;

  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer=""></script>
  <!-- Google Maps API for Flutter Web -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCfFU3rDAmKn7OilPL3kFSj2_GlTZ5ArWc&loading=async"></script>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
  
  
  
  
  <style id="splash-screen-style">
    @keyframes splashLoop {
      0% { opacity: 0; }
      8% { opacity: 0; }
      20% { opacity: 1; }
      45% { opacity: 1; }
      55% { opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes splashLoopScale {
      0% { transform: scale(0.3); }
      8% { transform: scale(0.3); }
      20% { transform: scale(1.15); }
      28% { transform: scale(0.95); }
      35% { transform: scale(1); }
      100% { transform: scale(1); }
    }
    @keyframes logoLoop {
      0% { opacity: 0; transform: scale(0.85); }
      45% { opacity: 0; transform: scale(0.85); }
      60% { opacity: 1; transform: scale(1); }
      85% { opacity: 1; transform: scale(1); }
      95% { opacity: 0; transform: scale(1); }
      100% { opacity: 0; transform: scale(0.85); }
    }
    #splash-pin {
      animation: splashLoop 3s linear infinite, splashLoopScale 3s linear infinite;
    }
    #splash-logo {
      animation: logoLoop 3s linear infinite;
    }
    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #FFFFFF;
          background-size: 100% 100%;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: #FFFFFF;
          }
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
  </script>
</head>
<body>
  <picture id="splash">
      <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:220px;height:120px;">
        <svg id="splash-pin" style="position:absolute;top:0;left:50%;margin-left:-30px;" width="60" height="60"
          viewBox="0 0 24 24" fill="#D32F2F">
          <path
            d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z" />
        </svg>
        <img id="splash-logo" src="assets/assets/images/route39_logo.png" alt=""
          style="position:absolute;top:0;left:0;width:220px;height:auto;">
      </div>
  </picture>
  
  
  
  <script>
    window.addEventListener('load', function(ev) {
      // Download main.dart.js
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            appRunner.runApp();
            setTimeout(removeSplashFromWeb, 1700);
          });
        }
      });
    });
  </script>


</body></html>
