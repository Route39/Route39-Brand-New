fragment UpdateStatus on UpdateStatus {
  orderId
  status
  directions {
    ...Coordinate
  }
  nextDestination {
    ...Waypoint
  }
  totalCost
  waitingChargeAmount
}

fragment ActiveOrder on ActiveOrder {
  id
  serviceName
  type
  currency
  serviceImageAddress
  pickupEta
  dropoffEta
  waitMinutes
  directions {
    ...Coordinate
  }
  estimatedDistance
  estimatedDuration
  createdAt
  scheduledAt
  unreadMessagesCount
  options {
    icon
    name
  }
  nextDestination {
    ...Waypoint
  }
  rider {
    ...customer
  }
  status
  pickupOtpRequired
  totalCost
  couponDiscount
  costBest
  providerShare
  gstPercent
  gstAmount
  platformFee
  platformFeeAmount
  paymentGatewayFeePercent
  paymentGatewayFeeAmount
  waitingChargeAmount
  arrivedAt
  cargoWaitingTimeMinutes
  paymentMethod {
    ...PaymentMethod
  }
  waypoints {
    ...Waypoint
  }
  chatMessages {
    ...ChatMessage
  }
}
