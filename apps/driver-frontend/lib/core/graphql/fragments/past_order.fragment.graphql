fragment PastOrder on PastOrder {
  id
  status
  serviceName
  serviceImageAddress
  options {
    ...RideOption
  }
  rider {
    firstName
    profileImageUrl
  }

  waypoints {
    ...place
  }
  totalCost
  paymentMode
  customerRating
  directions {
    ...Coordinate
  }
  type
  waitMinutes
  currency
  createdAt
  estimatedDistance
  estimatedDuration
  scheduledAt
  pickupEta
  dropoffEta
}
